<svg xmlns="http://www.w3.org/2000/svg" width="398" height="92" viewBox="0 0 398 92" role="img" aria-label="MediFlow, IA al servicio de la salud, concepto A">
<g transform="translate(10 10) scale(1.045)"><defs>
 <linearGradient id="mf-a-top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10C2DD"/><stop offset="1" stop-color="#11A8D6"/></linearGradient>
 <linearGradient id="mf-a-right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#178FE9"/><stop offset="1" stop-color="#156BE8"/></linearGradient>
 <linearGradient id="mf-a-bottom" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16B4E2"/><stop offset="1" stop-color="#168CD9"/></linearGradient>
</defs>
<!-- Four independently constructed modular arms; the open hub is intentional negative space. -->
<rect x="25" y="3" width="18" height="28" rx="6.25" fill="url(#mf-a-top)"/>
<rect x="3" y="25" width="28" height="18" rx="6.25" fill="#14B6CB"/>
<rect x="37" y="25" width="28" height="18" rx="6.25" fill="url(#mf-a-right)"/>
<rect x="25" y="37" width="18" height="28" rx="6.25" fill="url(#mf-a-bottom)"/>
<!-- Resolve the junction with a clean white four-way routing hub. -->

</g>
<g fill="#111827" font-family="Inter, Arial, sans-serif"><text x="94" y="46" font-size="31" font-weight="750" letter-spacing="-1.3">MediFlow</text></g>
<text x="96" y="66" font-family="Inter, Arial, sans-serif" font-size="12.4" font-weight="500" fill="#58657A">IA al servicio de la salud</text>
</svg>