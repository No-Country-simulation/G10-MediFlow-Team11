services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mediflow_local_demo
      POSTGRES_USER: mediflow_local_demo
      POSTGRES_PASSWORD: ${LOCAL_DEMO_DB_PASSWORD:?Set a disposable local-demo password}
    volumes:
      - local_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow_local_demo -d mediflow_local_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-core:
    build:
      context: ./ai-core
    environment:
      GEMINI_API_KEY: ""
      GEMINI_MODEL: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 999:999 /storage && chmod 700 /storage"]
    volumes:
      - local_demo_objects:/storage
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local-demo
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mediflow_local_demo
      DB_USER: mediflow_local_demo
      DB_PASSWORD: ${LOCAL_DEMO_DB_PASSWORD:?Set a disposable local-demo password}
      LOCAL_DEMO_STORAGE_ROOT: /var/lib/mediflow-local-demo/objects
      MEDIFLOW_AI_SERVICE_URL: http://ai-core:8000
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - local_demo_objects:/var/lib/mediflow-local-demo/objects
    depends_on:
      postgres:
        condition: service_healthy
      ai-core:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  local_demo_postgres:
  local_demo_objects:
